# WIOM Control Tower — web app + sync loop
# Jalankan: docker compose up -d
services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      WIOM_EMBEDDED_SYNC: "0"
      WIOM_SYNC_REQUIRED: "0"
    volumes:
      - ./db:/app/db            # history + state DuckDB hidup di host
      - ./config:/app/config    # kebijakan bisa diedit tanpa rebuild
    depends_on:
      sync:
        condition: service_healthy
    restart: unless-stopped

  sync:
    build:
      context: .
      target: sync
    working_dir: /app
    environment:
      SUPERSET_BASE_URL: ${SUPERSET_BASE_URL:-}
      SUPERSET_USERNAME: ${SUPERSET_USERNAME:-}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-}
      SUPERSET_COOKIE_HEADER: ${SUPERSET_COOKIE_HEADER:-}
      SUPERSET_SESSION_COOKIE: ${SUPERSET_SESSION_COOKIE:-}
      SUPERSET_ACCESS_TOKEN: ${SUPERSET_ACCESS_TOKEN:-}
    volumes:
      - ./db:/app/db
      - ./config:/app/config
    command: ["python3", "scripts/superset_to_duckdb.py", "--config", "config/superset-sync.json", "--daemon"]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,time; from datetime import datetime; h=json.load(open('db/.superset-sync-heartbeat.json')); assert h.get('ready') and time.time()-datetime.fromisoformat(h['heartbeat_at']).timestamp()<20"
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  scheduler:
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    environment:
      SCHEDULER_BASE_URL: http://web:3000
    volumes:
      - ./scripts/scheduler.mjs:/app/scheduler.mjs:ro
    command: ["node", "/app/scheduler.mjs"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
